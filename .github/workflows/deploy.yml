name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::054422645032:role/smustudent021-ECR-Push-Role

  ECR_REPOSITORY: polight/backend
  ECR_REGISTRY: 054422645032.dkr.ecr.ap-northeast-2.amazonaws.com

  EC2_INSTANCE_ID: i-075f107e3008d4978
  DEPLOY_DIR: /home/ec2-user/polight

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build image and deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Repository Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. GitHub OIDC -> AWS IAM Role
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. GitHub Actions -> ECR Login
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Docker Image Build + ECR Push
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SSM -> EC2 자동 배포
      - name: Deploy to EC2 via SSM
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        run: |
          python3 <<'PY'
          import base64
          import json
          import os

          with open("docker-compose.prod.yml", "rb") as f:
              compose_b64 = base64.b64encode(f.read()).decode("ascii")

          image_uri = os.environ["IMAGE_URI"]
          registry = os.environ["ECR_REGISTRY"]
          region = os.environ["AWS_REGION"]
          deploy_dir = os.environ["DEPLOY_DIR"]

          commands = [
              "set -e",

              # 배포 디렉터리 생성
              f"mkdir -p {deploy_dir}",

              # GitHub의 최신 docker-compose.prod.yml을 EC2에 저장
              f"echo '{compose_b64}' | base64 -d > {deploy_dir}/docker-compose.prod.yml",

              # compose 파일의 소유자를 ec2-user로 설정
              f"chown ec2-user:ec2-user {deploy_dir}/docker-compose.prod.yml",

              # ECR Login
              f"""sudo -u ec2-user -H bash -lc '
              aws ecr get-login-password --region {region} |
              docker login \
                --username AWS \
                --password-stdin {registry}
              '""",

              # docker-compose.prod.yml + .env 유효성 검사
              f"""sudo -u ec2-user -H bash -lc '
              cd {deploy_dir} &&
              BACKEND_IMAGE={image_uri} \
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                config --quiet
              '""",

              # 방금 GitHub Actions에서 빌드한 정확한 SHA 이미지 Pull
              f"""sudo -u ec2-user -H bash -lc '
              cd {deploy_dir} &&
              BACKEND_IMAGE={image_uri} \
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                pull backend
              '""",

              # PostgreSQL + Spring Boot 실행/갱신
              f"""sudo -u ec2-user -H bash -lc '
              cd {deploy_dir} &&
              BACKEND_IMAGE={image_uri} \
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                up -d --remove-orphans
              '""",

              # 최종 상태 확인
              f"""sudo -u ec2-user -H bash -lc '
              cd {deploy_dir} &&
              BACKEND_IMAGE={image_uri} \
              docker compose \
                --env-file .env \
                -f docker-compose.prod.yml \
                ps
              '"""
          ]

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --region "${AWS_REGION}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          # SSM 명령 실행 결과 확인
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              break
            fi

            if [ "${STATUS}" = "Failed" ] || \
               [ "${STATUS}" = "Cancelled" ] || \
               [ "${STATUS}" = "TimedOut" ]; then

              echo "EC2 deployment failed."

              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --region "${AWS_REGION}"

              exit 1
            fi

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment did not complete within the expected time."

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --region "${AWS_REGION}"

            exit 1
          fi

          # 성공 결과 출력
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --region "${AWS_REGION}" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'

      # 7. GitHub Actions Summary
      - name: Summary
        if: success()
        run: |
          {
            echo "### Polight Deployment Success"
            echo ""
            echo "- Repository: \`${{ env.ECR_REPOSITORY }}\`"
            echo "- Region: \`${{ env.AWS_REGION }}\`"
            echo "- EC2: \`${{ env.EC2_INSTANCE_ID }}\`"
            echo "- Image Tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"