<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kakao JWT Test</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18202c;
        --muted: #667085;
        --line: #d8dee8;
        --panel: #ffffff;
        --bg: #f5f7fb;
        --yellow: #fee500;
        --green: #157f54;
        --red: #c33d3d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .status {
        min-width: 180px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
        font-weight: 700;
      }

      .status.success {
        border-color: rgba(21, 127, 84, 0.35);
        color: var(--green);
      }

      .status.error {
        border-color: rgba(195, 61, 61, 0.35);
        color: var(--red);
      }

      .grid {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 16px;
      }

      section {
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 18px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 17px;
        line-height: 1.35;
        letter-spacing: 0;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input,
      textarea,
      pre {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfe;
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      input,
      textarea {
        padding: 10px 11px;
      }

      textarea {
        min-height: 130px;
        resize: vertical;
      }

      pre {
        min-height: 156px;
        margin: 0;
        padding: 12px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 0 14px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
      }

      .kakao {
        flex: 1;
        background: var(--yellow);
        color: #191600;
      }

      .secondary {
        background: #eef2f8;
        border-color: var(--line);
        color: var(--ink);
      }

      .token-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .token-row h2 {
        margin: 0;
      }

      .meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 20px, 980px);
          padding: 20px 0;
        }

        header,
        .grid {
          display: block;
        }

        .status {
          margin-top: 12px;
        }

        section + section {
          margin-top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Kakao JWT Test</h1>
          <div class="meta">카카오 로그인 후 서버 JWT 발급 결과를 확인합니다.</div>
        </div>
        <div id="status" class="status">대기 중</div>
      </header>

      <div class="grid">
        <section>
          <h2>로그인 요청</h2>
          <label for="clientId">Kakao REST API Key</label>
          <input id="clientId" autocomplete="off" placeholder="Kakao Developers REST API 키" />

          <label for="redirectUri">Redirect URI</label>
          <input id="redirectUri" autocomplete="off" />

          <div class="actions">
            <button class="kakao" id="loginButton" type="button">카카오 로그인</button>
            <button class="secondary" id="resetButton" type="button">초기화</button>
          </div>

          <div class="meta" id="requestMeta"></div>
        </section>

        <section>
          <div class="token-row">
            <h2>서버 응답</h2>
            <button class="secondary" id="copyButton" type="button">복사</button>
          </div>
          <label for="authorizationCode">Authorization Code</label>
          <textarea id="authorizationCode" readonly></textarea>

          <label for="accessToken">JWT Access Token</label>
          <textarea id="accessToken" readonly></textarea>

          <label>JWT Payload</label>
          <pre id="payload">아직 발급된 토큰이 없습니다.</pre>
        </section>
      </div>
    </main>

    <script>
      const statusEl = document.querySelector("#status");
      const clientIdEl = document.querySelector("#clientId");
      const redirectUriEl = document.querySelector("#redirectUri");
      const requestMetaEl = document.querySelector("#requestMeta");
      const authorizationCodeEl = document.querySelector("#authorizationCode");
      const accessTokenEl = document.querySelector("#accessToken");
      const payloadEl = document.querySelector("#payload");
      const loginButton = document.querySelector("#loginButton");
      const resetButton = document.querySelector("#resetButton");
      const copyButton = document.querySelector("#copyButton");

      const params = new URLSearchParams(window.location.search);
      const defaultRedirectUri = `${window.location.origin}${window.location.pathname}`;
      redirectUriEl.value = localStorage.getItem("kakaoTestRedirectUri") || defaultRedirectUri;
      clientIdEl.value = localStorage.getItem("kakaoTestClientId") || "";
      requestMetaEl.textContent = `서버 oauth.kakao.redirect-uri와 같은 값이어야 합니다: ${redirectUriEl.value}`;

      function setStatus(text, type = "") {
        statusEl.textContent = text;
        statusEl.className = `status ${type}`.trim();
      }

      function decodeJwtPayload(token) {
        const payload = token.split(".")[1];
        const normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
        const json = decodeURIComponent(
          atob(normalized)
            .split("")
            .map((char) => `%${`00${char.charCodeAt(0).toString(16)}`.slice(-2)}`)
            .join(""),
        );
        return JSON.parse(json);
      }

      function saveConfig() {
        localStorage.setItem("kakaoTestClientId", clientIdEl.value.trim());
        localStorage.setItem("kakaoTestRedirectUri", redirectUriEl.value.trim());
      }

      loginButton.addEventListener("click", () => {
        saveConfig();
        const clientId = clientIdEl.value.trim();
        const redirectUri = redirectUriEl.value.trim();

        if (!clientId || !redirectUri) {
          setStatus("설정 필요", "error");
          return;
        }

        const state = crypto.randomUUID();
        sessionStorage.setItem("kakaoOAuthState", state);
        const authUrl = new URL("https://kauth.kakao.com/oauth/authorize");
        authUrl.searchParams.set("response_type", "code");
        authUrl.searchParams.set("client_id", clientId);
        authUrl.searchParams.set("redirect_uri", redirectUri);
        authUrl.searchParams.set("state", state);
        window.location.assign(authUrl.toString());
      });

      resetButton.addEventListener("click", () => {
        history.replaceState(null, "", window.location.pathname);
        authorizationCodeEl.value = "";
        accessTokenEl.value = "";
        payloadEl.textContent = "아직 발급된 토큰이 없습니다.";
        setStatus("대기 중");
      });

      copyButton.addEventListener("click", async () => {
        if (!accessTokenEl.value) {
          setStatus("토큰 없음", "error");
          return;
        }
        await navigator.clipboard.writeText(accessTokenEl.value);
        setStatus("복사 완료", "success");
      });

      async function exchangeCodeForJwt() {
        const code = params.get("code");
        const error = params.get("error");
        const returnedState = params.get("state");
        const expectedState = sessionStorage.getItem("kakaoOAuthState");

        if (error) {
          setStatus("카카오 오류", "error");
          payloadEl.textContent = `${error}\n${params.get("error_description") || ""}`.trim();
          return;
        }

        if (!code) {
          return;
        }

        if (expectedState && returnedState !== expectedState) {
          setStatus("state 불일치", "error");
          payloadEl.textContent = "OAuth state 값이 일치하지 않습니다.";
          return;
        }

        authorizationCodeEl.value = code;
        setStatus("서버 요청 중");

        try {
          const response = await fetch("/api/auth/kakao/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ authorizationCode: code }),
          });

          const body = await response.json();
          if (!response.ok) {
            throw new Error(JSON.stringify(body, null, 2));
          }

          accessTokenEl.value = body.accessToken;
          payloadEl.textContent = JSON.stringify(decodeJwtPayload(body.accessToken), null, 2);
          setStatus("JWT 발급 성공", "success");
          history.replaceState(null, "", window.location.pathname);
        } catch (error) {
          setStatus("JWT 발급 실패", "error");
          payloadEl.textContent = error.message;
        }
      }

      exchangeCodeForJwt();
    </script>
  </body>
</html>
