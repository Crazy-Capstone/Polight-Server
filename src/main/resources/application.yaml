spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Polight-Server

  datasource:
    url: jdbc:postgresql://localhost:5432/polight
    username: polight
    password: polight
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  docker:
    compose:
      enabled: false

security:
  jwt:
    secret: "change-this-to-at-least-32-bytes-secret-key"
    access-token-expiry-seconds: 3600


oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET:}

storage:
  # local: 로컬 파일시스템(개발 기본값) / s3: S3 버킷(배포)
  type: ${STORAGE_TYPE:local}

  # type=local 일 때만 사용
  policy-documents-directory: ${POLICY_DOCUMENTS_DIRECTORY:uploads/policy-documents}

  # type=s3 일 때만 사용. S3_BUCKET 이 없으면 기동에 실패한다.
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${S3_KEY_PREFIX:policy-documents}
