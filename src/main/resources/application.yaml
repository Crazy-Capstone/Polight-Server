spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Polight-Server

  datasource:
    url: jdbc:postgresql://localhost:5432/polight
    username: polight
    password: polight
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  docker:
    compose:
      enabled: false

security:
  jwt:
    # security.jwt.secret 은 여기에 정의하지 않습니다.
    # SECURITY_JWT_SECRET 환경변수(.env / 배포 환경)로 주입해야 하며, 없으면 기동에 실패합니다.
    access-token-expiry-seconds: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET:}

storage:
  policy-documents-directory: ${POLICY_DOCUMENTS_DIRECTORY:uploads/policy-documents}
