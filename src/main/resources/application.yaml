spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Polight-Server

  datasource:
    url: jdbc:postgresql://localhost:5432/polight
    username: polight
    password: polight
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      # 스키마를 바꿀 수 있는 주체는 Flyway 하나다. Hibernate는 검증만 한다.
      #
      # update로 두면 Hibernate가 "엔티티에 있는데 DB에 없는 것"을 기동할 때마다 말없이
      # 추가한다. 그러면 같은 스키마를 Flyway와 Hibernate가 각자 만들게 되고,
      #   - 새 엔티티를 추가하면 마이그레이션이 돌기 전에 Hibernate가 테이블을 먼저 만들어
      #     이후 마이그레이션이 "이미 존재한다"로 실패한다
      #   - 제약 이름이 어긋나면 같은 컬럼에 UNIQUE가 하나 더 붙는다
      #     (V1__baseline_schema.sql 헤더 주석이 이 문제로 이름을 고정해 둔 이유다)
      #   - 어떤 컬럼이 어디서 생긴 것인지 추적할 수 없어, 마이그레이션 파일만으로
      #     스키마를 재현할 수 없게 된다
      #
      # validate는 엔티티와 실제 스키마가 다르면 손대지 않고 기동을 실패시킨다.
      # 대가로, 엔티티를 바꿀 때는 반드시 같은 PR에 마이그레이션을 함께 넣어야 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이력 테이블 없이 테이블만 있는 DB를 만나면 그냥 멈춘다.
    #
    # true + baseline-version: 0 조합은 도움이 되지 않았다. 버전 0으로 baseline을 찍은 뒤
    # V1부터 다시 적용하므로 "relation ... already exists"로 실패하는데, 이 메시지는 실제
    # 원인(이력 테이블이 없다)을 가린다. false면 그 사실을 그대로 알려주고 멈춘다.
    baseline-on-migrate: false

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      # 기본값 1MB로는 실제 약관 PDF(수 MB~수십 MB)를 받을 수 없다.
      # max-request-size 는 파일 외에 여행 정보 파트까지 포함하므로 파일 상한보다 크게 둔다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:30MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:35MB}

security:
  jwt:
    # security.jwt.secret 은 여기에 정의하지 않습니다.
    # SECURITY_JWT_SECRET 환경변수(.env / 배포 환경)로 주입해야 하며, 없으면 기동에 실패합니다.
    access-token-expiry-seconds: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRY_SECONDS:3600}

internal:
  # AI 서버와 공유하는 시크릿. 양쪽이 같은 값을 쓴다.
  # 미설정이면 /internal/** 요청을 전부 거부한다(InternalApiKeyFilter). 로컬 개발은 키 없이 그대로 된다.
  api-key: ${INTERNAL_API_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET:}

storage:
  # local: 로컬 파일시스템(개발 기본값) / s3: S3 버킷(배포)
  type: ${STORAGE_TYPE:local}

  # type=local 일 때만 사용
  policy-documents-directory: ${POLICY_DOCUMENTS_DIRECTORY:uploads/policy-documents}

  # type=s3 일 때만 사용. S3_BUCKET 이 없으면 기동에 실패한다.
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${S3_KEY_PREFIX:policy-documents}
    # URL은 DB에 저장하지 않고 AI 분석 요청 직전에 object key로 생성한다.
    # AI 팀에 15분으로 회신한 값. 대용량 약관 다운로드 시간을 보고 조정한다.
    presigned-get-expiry: ${S3_PRESIGNED_GET_EXPIRY:15m}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # AI 서버 문서 기준 경로는 단수형(/internal/analysis)이다.
    analysis-path: ${AI_SERVER_ANALYSIS_PATH:/internal/analysis}
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:10s}

    # 챗봇 질의는 분석 요청과 타임아웃이 다르다. 분석 요청은 AI가 202만 돌려주고 끊으므로
    # 10s로 충분하지만, 질의는 검색과 LLM 생성이 끝날 때까지 응답을 기다린다.
    # read-timeout을 그대로 쓰면 정상 응답을 타임아웃으로 오인해 버린다.
    rag-path: ${AI_SERVER_RAG_PATH:/internal/rag/query}
    rag-read-timeout: ${AI_SERVER_RAG_READ_TIMEOUT:60s}

    # 챗봇에 실어 보낼 대화 이력 길이. AI 서버와 6개(3턴)로 합의했다.
    # 프롬프트 길이를 예측 가능하게 두기 위한 값이라 양쪽이 같이 움직여야 한다.
    chat-history-size: ${AI_SERVER_CHAT_HISTORY_SIZE:6}
    max-attempts: ${AI_SERVER_MAX_ATTEMPTS:3}
    retry-delay: ${AI_SERVER_RETRY_DELAY:500ms}

analysis:
  timeout:
    # AI 서버가 분석 요청은 정상으로 받고 콜백을 보내지 않으면 분석은 PROCESSING 에 영구히 머문다.
    # 프론트엔드는 상태가 바뀔 때까지 폴링하므로 그 화면이 끝나지 않는다. 이 시간이 지난 분석은 FAILED 로
    # 내려 사용자가 상황을 알고 POST .../analysis 로 재시도할 수 있게 한다.
    enabled: ${ANALYSIS_TIMEOUT_ENABLED:true}
    after: ${ANALYSIS_TIMEOUT_AFTER:10m}
    # check-interval 만 ISO-8601 인 이유: @Scheduled 의 fixedDelayString 은 "PT1M" 또는 밀리초 숫자만
    # 받는다. "1m" 은 파싱하지 못한다. after 는 Duration 으로 바인딩되므로 "10m" 이 그대로 통한다.
    check-interval: ${ANALYSIS_TIMEOUT_CHECK_INTERVAL:PT1M}

logging:
  level:
    # 들어오는 요청의 메서드/URI 를 요청마다 한 줄씩 찍는다.
    # 운영에서 로그량이 부담되면 LOGGING_LEVEL_DISPATCHER=INFO 로 끈다.
    org.springframework.web.servlet.DispatcherServlet: ${LOGGING_LEVEL_DISPATCHER:DEBUG}

    # AI 로 나가는 질의에 무엇이 실렸는지 요청마다 한 줄. INFO 로도 termsId·담보 수·이력 수가 남는다.
    # DEBUG 로 올리면 담보명까지 남는다 -- 증권에서 읽은 상품 정보라 평소에는 내려 둔다.
    polight.server.domain.chat.client: ${LOGGING_LEVEL_CHAT_CLIENT:INFO}
