spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Polight-Server

  datasource:
    url: jdbc:postgresql://localhost:5432/polight
    username: polight
    password: polight
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

polight:
  file-storage:
    directory: ${POLIGHT_FILE_STORAGE_DIR:./data/policy-documents}
    max-size-bytes: ${POLIGHT_FILE_MAX_SIZE:10485760}

security:
  jwt:
    secret: "change-this-to-at-least-32-bytes-secret-key"
    access-token-expiry-seconds: 3600


oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET:}
