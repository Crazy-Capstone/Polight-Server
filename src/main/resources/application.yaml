spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Polight-Server

  datasource:
    url: jdbc:postgresql://localhost:5432/polight
    username: polight
    password: polight
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  docker:
    compose:
      enabled: false

security:
  jwt:
    secret: "change-this-to-at-least-32-bytes-secret-key"
    access-token-expiry-seconds: 3600


oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET:}
