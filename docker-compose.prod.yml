services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polight-postgres
    restart: unless-stopped

    # 같은 EC2 에 AI 컨테이너가 함께 뜨고, AI 배포는 호스트에서 직접 이미지를 빌드한다.
    # 한도가 없으면 빌드 피크에 OOM Killer 가 개입할 때 희생 대상이 될 수 있다.
    mem_limit: 512m

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - polight-network


  backend:
    image: ${BACKEND_IMAGE:-054422645032.dkr.ecr.ap-northeast-2.amazonaws.com/polight/backend:latest}
    container_name: polight-backend
    restart: unless-stopped

    # Dockerfile 의 -XX:MaxRAMPercentage=75.0 은 cgroup 한도를 읽는다.
    # 한도가 없으면 JVM 이 호스트 전체(4GB)의 75% 를 자기 몫으로 계산해
    # 힙을 3GB 까지 늘릴 수 있고, 한 번 늘린 힙은 거의 반납하지 않는다.
    # 이 값을 지우면 AI 배포 시 빌드 피크와 겹쳐 백엔드가 OOM 으로 죽는다. (한도 1280m -> 힙 960m)
    #
    # 한도는 컨테이너 전체이고 힙은 그중 75% 다. 남는 320m 이 메타스페이스 / 코드 캐시 /
    # 스레드 스택 / 다이렉트 버퍼 몫이다. 1g 로 줄이면 비힙이 256m 뿐이라
    # 힙이 한도 아래인데도 cgroup 에 걸려 죽을 수 있다. 30MB 파일 업로드가 다이렉트 버퍼를 쓴다.
    mem_limit: 1280m

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}

      # AI 서버와 공유하는 내부 API 키. 양쪽이 같은 값을 쓴다.
      # 미설정이면 /internal/** 요청을 전부 거부하므로 AI 콜백이 401로 막힌다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      # AI 서버 origin. 스킴+호스트+포트까지만 적고 경로/끝 슬래시는 붙이지 않는다.
      # 미설정이면 기본값 http://localhost:8000 이 먹어 컨테이너 자기 자신을 호출하고 분석이 FAILED 된다.
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # 콜백이 오지 않아 PROCESSING 에 멈춘 분석을 FAILED 로 내리기까지의 시간.
      # 실제 분석 소요 시간을 보고 조정한다. 너무 짧으면 정상 분석을 실패로 죽인다.
      ANALYSIS_TIMEOUT_AFTER: ${ANALYSIS_TIMEOUT_AFTER:-10m}

      # 위 타임아웃 처리 자체의 on/off. 끄면 콜백이 오지 않는 분석이 PROCESSING 에 영구히 남고
      # 프론트엔드 폴링이 끝나지 않는다. 문제 상황을 관찰해야 할 때만 임시로 끈다.
      ANALYSIS_TIMEOUT_ENABLED: ${ANALYSIS_TIMEOUT_ENABLED:-true}

      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}

      # 업로드된 약관 파일은 S3 에 저장한다. 컨테이너 쓰기 레이어에 두면
      # 이미지 교체/컨테이너 재생성 때 사라져 DB의 stored_file_path 와 어긋난다.
      STORAGE_TYPE: s3
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

    ports:
      - "80:8080"

    networks:
      - polight-network


volumes:
  postgres_data:


networks:
  polight-network: