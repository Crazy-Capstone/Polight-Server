services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polight-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - polight-network


  backend:
    image: ${BACKEND_IMAGE:-054422645032.dkr.ecr.ap-northeast-2.amazonaws.com/polight/backend:latest}
    container_name: polight-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}

      # AI 서버와 공유하는 내부 API 키. 양쪽이 같은 값을 쓴다.
      # 미설정이면 /internal/** 요청을 전부 거부하므로 AI 콜백이 401로 막힌다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      # AI 서버 origin. 스킴+호스트+포트까지만 적고 경로/끝 슬래시는 붙이지 않는다.
      # 미설정이면 기본값 http://localhost:8000 이 먹어 컨테이너 자기 자신을 호출하고 분석이 FAILED 된다.
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # 콜백이 오지 않아 PROCESSING 에 멈춘 분석을 FAILED 로 내리기까지의 시간.
      # 실제 분석 소요 시간을 보고 조정한다. 너무 짧으면 정상 분석을 실패로 죽인다.
      ANALYSIS_TIMEOUT_AFTER: ${ANALYSIS_TIMEOUT_AFTER:-10m}

      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}

      # 업로드된 약관 파일은 S3 에 저장한다. 컨테이너 쓰기 레이어에 두면
      # 이미지 교체/컨테이너 재생성 때 사라져 DB의 stored_file_path 와 어긋난다.
      STORAGE_TYPE: s3
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}

    ports:
      - "80:8080"

    networks:
      - polight-network


volumes:
  postgres_data:


networks:
  polight-network: