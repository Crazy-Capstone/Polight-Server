version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polight
      POSTGRES_USER: polight
      POSTGRES_PASSWORD: polight
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polight -d polight"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
